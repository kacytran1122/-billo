# Red-Flag Screener rules. Runs FIRST, every time. Plain words, no AI.
# If ANY word in "any" appears, Billo stops shopping and says "say".
# Medical team review needed before real use. This list is a demo starting point.
rules:
  - id: RF-CHEST
    any: ["chest pain", "chest pressure", "pain in my chest", "crushing"]
    say: "Chest pain can be an emergency. Call 911 now. Do not drive yourself."
  - id: RF-BREATH
    any: ["can't breathe", "cannot breathe", "short of breath", "trouble breathing", "choking"]
    say: "Trouble breathing is an emergency. Call 911 now."
  - id: RF-STROKE
    any: ["face drooping", "slurred", "can't move my arm", "sudden numbness", "worst headache"]
    say: "These can be signs of a stroke. Call 911 now."
  - id: RF-BLEED
    any: ["won't stop bleeding", "bleeding a lot", "heavy bleeding", "bone sticking out"]
    say: "This needs emergency care. Call 911 or go to the nearest ER now."
  - id: RF-HEAD
    any: ["passed out", "fainted", "hit my head and", "confused after"]
    say: "Losing consciousness or confusion after a head hit needs the ER now. Call 911 if you can't get there safely."
  - id: RF-SELF
    any: ["kill myself", "suicide", "end my life"]
    say: "You deserve support right now. In the US, call or text 988 (Suicide & Crisis Lifeline), or call 911."
