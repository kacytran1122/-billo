name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/api/requirements.txt
            backend/fetch.ai/requirements.txt
      - run: pip install -r backend/api/requirements.txt -r backend/fetch.ai/requirements.txt
      - run: pytest -q tests/backend

  photon:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/photon
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/photon/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run typecheck

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  oracle-arm64-images:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: core
            dockerfile: Dockerfile
          - name: fetch-ai
            dockerfile: backend/fetch.ai/Dockerfile
          - name: photon
            dockerfile: backend/photon/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/arm64
          push: false
          cache-from: type=gha,scope=oracle-${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=oracle-${{ matrix.name }}
