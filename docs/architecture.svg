<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1640" viewBox="0 0 1800 1640">
  <defs>
    <style>
      .bg{fill:#f8fafc}.ink{fill:#13233b}.muted{fill:#58677c}.title{font:700 42px Arial,sans-serif}.sub{font:20px Arial,sans-serif}.h{font:700 24px Arial,sans-serif}.boxh{font:700 21px Arial,sans-serif}.body{font:18px Arial,sans-serif}.small{font:16px Arial,sans-serif}.tiny{font:14px Arial,sans-serif}.label{font:700 17px Arial,sans-serif;letter-spacing:1.4px}.num{font:700 17px Arial,sans-serif;fill:#fff}.arrow{stroke:#1f2b3d;stroke-width:4;fill:none;marker-end:url(#arrow)}.dash{stroke:#ad1d5a;stroke-width:3;stroke-dasharray:10 8;fill:none;marker-end:url(#pinkArrow)}
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f2b3d"/></marker>
    <marker id="pinkArrow" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#ad1d5a"/></marker>
  </defs>

  <rect class="bg" width="1800" height="1640"/>
  <text x="55" y="70" class="title ink">Billo · System Architecture</text>
  <text x="58" y="105" class="sub muted">Plan care before the visit. Organize records and guarded settlement simulations after care.</text>

  <!-- Patient journey -->
  <rect x="50" y="135" width="1700" height="210" rx="26" fill="#fffaf0" stroke="#f59e0b" stroke-width="3"/>
  <text x="76" y="173" class="label" fill="#a64b00">WHAT THE PATIENT DOES · SIX CLEAR ACTIONS</text>
  <g>
    <rect x="75" y="195" width="240" height="92" rx="18" fill="#fff" stroke="#f59e0b" stroke-width="2"/>
    <text x="195" y="230" text-anchor="middle" class="boxh ink">1 · Describe need</text><text x="195" y="260" text-anchor="middle" class="body muted">plain words</text>
    <rect x="355" y="195" width="240" height="92" rx="18" fill="#fff" stroke="#f59e0b" stroke-width="2"/>
    <text x="475" y="230" text-anchor="middle" class="boxh ink">2 · Pick care</text><text x="475" y="260" text-anchor="middle" class="body muted">compare place + price</text>
    <rect x="635" y="195" width="240" height="92" rx="18" fill="#fff" stroke="#f59e0b" stroke-width="2"/>
    <text x="755" y="230" text-anchor="middle" class="boxh ink">3 · Book visit</text><text x="755" y="260" text-anchor="middle" class="body muted">save estimate</text>
    <rect x="915" y="195" width="240" height="92" rx="18" fill="#fff" stroke="#f59e0b" stroke-width="2"/>
    <text x="1035" y="230" text-anchor="middle" class="boxh ink">4 · Send document</text><text x="1035" y="260" text-anchor="middle" class="body muted">bill or paid receipt</text>
    <rect x="1195" y="195" width="240" height="92" rx="18" fill="#fff" stroke="#f59e0b" stroke-width="2"/>
    <text x="1315" y="230" text-anchor="middle" class="boxh ink">5 · Review route</text><text x="1315" y="260" text-anchor="middle" class="body muted">QR or benefit</text>
    <rect x="1475" y="195" width="240" height="92" rx="18" fill="#fff" stroke="#f59e0b" stroke-width="2"/>
    <text x="1595" y="230" text-anchor="middle" class="boxh ink">6 · Approve demo</text><text x="1595" y="260" text-anchor="middle" class="body muted">explicit consent</text>
    <path d="M315 241 H350 M595 241 H630 M875 241 H910 M1155 241 H1190 M1435 241 H1470" class="arrow"/>
    <path d="M75 310 H875" stroke="#a64b00" stroke-width="2"/><text x="475" y="335" text-anchor="middle" class="label" fill="#a64b00">BEFORE CARE</text>
    <path d="M915 310 H1715" stroke="#a64b00" stroke-width="2"/><text x="1315" y="335" text-anchor="middle" class="label" fill="#a64b00">AFTER CARE</text>
  </g>

  <!-- Doors -->
  <rect x="260" y="390" width="380" height="110" rx="22" fill="#effcf9" stroke="#0f9f8e" stroke-width="3"/>
  <text x="450" y="430" text-anchor="middle" class="h ink">iMessage · Photon</text><text x="450" y="462" text-anchor="middle" class="body muted">private after-care · group-safe before-care</text>
  <rect x="710" y="390" width="380" height="110" rx="22" fill="#eef2f7" stroke="#526075" stroke-width="3"/>
  <text x="900" y="430" text-anchor="middle" class="h ink">Patient</text><text x="900" y="462" text-anchor="middle" class="body muted">uses either conversation door</text>
  <rect x="1160" y="390" width="380" height="110" rx="22" fill="#f3f0ff" stroke="#7547f3" stroke-width="3"/>
  <text x="1350" y="430" text-anchor="middle" class="h ink">ASI:One · Fetch.ai</text><text x="1350" y="462" text-anchor="middle" class="body muted">complete primary workflow</text>
  <path d="M710 445 H645 M1090 445 H1155" class="arrow"/>

  <!-- Photon layer -->
  <rect x="50" y="550" width="520" height="325" rx="24" fill="#eafbf8" stroke="#0f9f8e" stroke-width="3" stroke-dasharray="12 8"/>
  <text x="78" y="588" class="label" fill="#087e72">PHOTON LAYER · SPECTRUM + TYPESCRIPT BRIDGE</text>
  <rect x="78" y="620" width="215" height="88" rx="16" fill="#fff" stroke="#0f9f8e" stroke-width="2"/>
  <text x="185" y="651" text-anchor="middle" class="boxh ink">QR join</text><text x="185" y="680" text-anchor="middle" class="small muted">link ASI case to iMessage</text>
  <rect x="322" y="620" width="220" height="88" rx="16" fill="#fff" stroke="#0f9f8e" stroke-width="2"/>
  <text x="432" y="651" text-anchor="middle" class="boxh ink">Privacy router</text><text x="432" y="680" text-anchor="middle" class="small muted">hashes handles · private docs</text>
  <rect x="78" y="735" width="215" height="88" rx="16" fill="#fff" stroke="#0f9f8e" stroke-width="2"/>
  <text x="185" y="766" text-anchor="middle" class="boxh ink">STOP / HELP</text><text x="185" y="795" text-anchor="middle" class="small muted">consent and reminders</text>
  <rect x="322" y="735" width="220" height="88" rx="16" fill="#fff" stroke="#0f9f8e" stroke-width="2"/>
  <text x="432" y="766" text-anchor="middle" class="boxh ink">Attachment upload</text><text x="432" y="795" text-anchor="middle" class="small muted">temporary bill image</text>
  <path d="M450 500 V545" class="arrow"/>

  <!-- Agentverse -->
  <rect x="610" y="550" width="930" height="325" rx="24" fill="#f1f2ff" stroke="#6658e8" stroke-width="3" stroke-dasharray="12 8"/>
  <text x="638" y="588" class="label" fill="#5144d9">FETCH.AI AGENTVERSE · SEVEN TYPED AGENTS</text>
  <rect x="650" y="620" width="250" height="88" rx="17" fill="#dffaf5" stroke="#0f9f8e" stroke-width="2"/>
  <text x="775" y="651" text-anchor="middle" class="boxh ink">iMessage Gateway</text><text x="775" y="680" text-anchor="middle" class="small muted">thin transport adapter</text>
  <rect x="950" y="610" width="330" height="108" rx="18" fill="#5747e8"/>
  <text x="1115" y="651" text-anchor="middle" class="h" fill="#fff">Billo Coordinator</text><text x="1115" y="682" text-anchor="middle" class="small" fill="#e6e2ff">state · routing · one conversation</text>
  <path d="M900 664 H945" class="arrow"/>
  <rect x="1318" y="620" width="185" height="88" rx="17" fill="#fff" stroke="#ad1d5a" stroke-width="2"/>
  <text x="1410" y="651" text-anchor="middle" class="boxh ink">Case Medic</text><text x="1410" y="680" text-anchor="middle" class="small muted">safe recovery</text>
  <rect x="640" y="755" width="200" height="85" rx="16" fill="#fff" stroke="#ef6a6a" stroke-width="2"/>
  <text x="740" y="787" text-anchor="middle" class="boxh ink">Red-Flag</text><text x="740" y="815" text-anchor="middle" class="small muted">emergency rules</text>
  <rect x="865" y="755" width="200" height="85" rx="16" fill="#fff" stroke="#39a9c5" stroke-width="2"/>
  <text x="965" y="787" text-anchor="middle" class="boxh ink">Care Finder</text><text x="965" y="815" text-anchor="middle" class="small muted">places + prices</text>
  <rect x="1090" y="755" width="200" height="85" rx="16" fill="#fff" stroke="#6658e8" stroke-width="2"/>
  <text x="1190" y="787" text-anchor="middle" class="boxh ink">After-Care</text><text x="1190" y="815" text-anchor="middle" class="small muted">OCR reconciliation</text>
  <rect x="1315" y="755" width="200" height="85" rx="16" fill="#fff" stroke="#29358c" stroke-width="2"/>
  <text x="1415" y="787" text-anchor="middle" class="boxh ink">Settlement Router</text><text x="1415" y="815" text-anchor="middle" class="small muted">guards both simulations</text>
  <path d="M1115 718 V738 H740 V750 M1115 738 H965 V750 M1115 738 H1190 V750 M1115 738 H1415 V750" stroke="#1f2b3d" stroke-width="3" fill="none"/>
  <path d="M1350 500 V545" class="arrow"/>

  <!-- Koyeb Core -->
  <rect x="50" y="930" width="1490" height="290" rx="24" fill="#edfbf1" stroke="#16a34a" stroke-width="3" stroke-dasharray="12 8"/>
  <text x="78" y="970" class="label" fill="#12823d">KOYEB ECO SMALL · CORE API (FASTAPI) · $5.36/MONTH</text>
  <rect x="80" y="1010" width="300" height="150" rx="18" fill="#fff" stroke="#16a34a" stroke-width="2"/>
  <text x="230" y="1048" text-anchor="middle" class="h ink">Care tools</text><text x="230" y="1082" text-anchor="middle" class="body muted">search · estimates</text><text x="230" y="1112" text-anchor="middle" class="body muted">visit log · calendar</text>
  <rect x="420" y="1010" width="300" height="150" rx="18" fill="#fff" stroke="#16a34a" stroke-width="2"/>
  <text x="570" y="1048" text-anchor="middle" class="h ink">Document reader</text><text x="570" y="1082" text-anchor="middle" class="body muted">RapidOCR first</text><text x="570" y="1112" text-anchor="middle" class="body muted">vision fallback · delete upload</text>
  <rect x="760" y="1010" width="330" height="150" rx="18" fill="#fff" stroke="#16a34a" stroke-width="2"/>
  <text x="925" y="1048" text-anchor="middle" class="h ink">After-care records</text><text x="925" y="1082" text-anchor="middle" class="body muted">provider · amount · estimate</text><text x="925" y="1112" text-anchor="middle" class="body muted">conditional benefit routes</text>
  <rect x="1130" y="1010" width="370" height="150" rx="18" fill="#fff" stroke="#29358c" stroke-width="2"/>
  <text x="1315" y="1048" text-anchor="middle" class="h ink">Visa guardrails</text><text x="1315" y="1082" text-anchor="middle" class="body muted">QR verification · consent</text><text x="1315" y="1112" text-anchor="middle" class="body muted">idempotent simulation records</text>
  <path d="M1115 875 V925" class="arrow"/>

  <!-- Sentry -->
  <rect x="1580" y="550" width="170" height="670" rx="24" fill="#fff0f6" stroke="#ad1d5a" stroke-width="3"/>
  <text x="1665" y="590" text-anchor="middle" class="label" fill="#ad1d5a">SENTRY</text>
  <rect x="1600" y="620" width="130" height="120" rx="16" fill="#ad1d5a"/>
  <text x="1665" y="660" text-anchor="middle" class="boxh" fill="#fff">Observe</text><text x="1665" y="690" text-anchor="middle" class="small" fill="#fff">one case</text><text x="1665" y="716" text-anchor="middle" class="small" fill="#fff">one trace</text>
  <text x="1605" y="790" class="boxh ink">Tracing</text><text x="1605" y="820" class="small muted">all agents + Core</text>
  <text x="1605" y="875" class="boxh ink">Crons</text><text x="1605" y="905" class="small muted">follow-up checks</text>
  <text x="1605" y="960" class="boxh ink">Alerts</text><text x="1605" y="990" class="small muted">wake Case Medic</text>
  <text x="1605" y="1045" class="boxh ink">Privacy</text><text x="1605" y="1075" class="small muted">hashed case IDs</text><text x="1605" y="1100" class="small muted">no health data</text>
  <path d="M1580 700 H1508" class="dash"/><path d="M1580 1085 H1508" class="dash"/>

  <!-- Bottom services -->
  <rect x="50" y="1275" width="380" height="265" rx="22" fill="#f4f7fb" stroke="#64748b" stroke-width="3"/>
  <text x="78" y="1315" class="label" fill="#526075">EXTERNAL SOURCES</text>
  <text x="80" y="1360" class="body ink">NPI Registry</text><text x="80" y="1395" class="body ink">Care-site and price datasets</text><text x="80" y="1430" class="body ink">Google Maps imagery</text><text x="80" y="1465" class="body ink">Calendar links</text><text x="80" y="1500" class="small muted">Synthetic data remains the demo fallback.</text>

  <rect x="470" y="1275" width="480" height="265" rx="22" fill="#fff6ee" stroke="#f97316" stroke-width="3"/>
  <text x="498" y="1315" class="label" fill="#c6530c">TIGER DATA · DURABLE STATE</text>
  <text x="500" y="1360" class="body ink">Price history + percentiles</text><text x="500" y="1395" class="body ink">Estimates + live visit log</text><text x="500" y="1430" class="body ink">After-care records + benefit checks</text><text x="500" y="1465" class="body ink">Settlement simulation audit records</text><text x="500" y="1500" class="small muted">Schema applied through scripts/apply_schema.py.</text>

  <rect x="990" y="1275" width="550" height="265" rx="22" fill="#eef1ff" stroke="#29358c" stroke-width="3"/>
  <text x="1018" y="1315" class="label" fill="#29358c">VISA · EXPLICIT SIMULATION BOUNDARY</text>
  <circle cx="1025" cy="1360" r="17" fill="#29358c"/><text x="1025" y="1366" text-anchor="middle" class="num">1</text><text x="1055" y="1367" class="body ink">Unpaid: verify clinic QR → simulated wallet handoff</text>
  <circle cx="1025" cy="1410" r="17" fill="#29358c"/><text x="1025" y="1416" text-anchor="middle" class="num">2</text><text x="1055" y="1417" class="body ink">Paid: approved benefit → simulated Visa Direct payout</text>
  <circle cx="1025" cy="1460" r="17" fill="#29358c"/><text x="1025" y="1466" text-anchor="middle" class="num">3</text><text x="1055" y="1467" class="body ink">No sandbox/API · no PAN · no real funds moved</text>
  <text x="1020" y="1510" class="small muted">Real activation requires Visa onboarding and certification.</text>

  <path d="M380 1165 V1250 H710 V1270" class="arrow"/>
  <path d="M925 1165 V1270" class="arrow"/>
  <path d="M1315 1165 V1270" class="arrow"/>

  <!-- Legend -->
  <rect x="50" y="1570" width="1700" height="48" rx="14" fill="#eef2f7"/>
  <circle cx="85" cy="1594" r="10" fill="#5747e8"/><text x="105" y="1601" class="small ink">Fetch.ai agents</text>
  <circle cx="275" cy="1594" r="10" fill="#0f9f8e"/><text x="295" y="1601" class="small ink">Photon</text>
  <circle cx="400" cy="1594" r="10" fill="#16a34a"/><text x="420" y="1601" class="small ink">Koyeb Core</text>
  <circle cx="575" cy="1594" r="10" fill="#f97316"/><text x="595" y="1601" class="small ink">Tiger Data</text>
  <circle cx="755" cy="1594" r="10" fill="#29358c"/><text x="775" y="1601" class="small ink">Visa simulation</text>
  <circle cx="960" cy="1594" r="10" fill="#ad1d5a"/><text x="980" y="1601" class="small ink">Sentry</text>
  <text x="1190" y="1601" class="small muted">Solid arrows = work flow · dashed arrows = monitoring</text>
</svg>
