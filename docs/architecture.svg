<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1800" viewBox="0 0 1800 1800">
  <defs>
    <style>
      .bg{fill:#f8fafc}.ink{fill:#13233b}.muted{fill:#5d6b7f}.title{font:700 44px Arial,sans-serif}.sub{font:20px Arial,sans-serif}.section{font:700 17px Arial,sans-serif;letter-spacing:1.5px}.h{font:700 23px Arial,sans-serif}.boxh{font:700 19px Arial,sans-serif}.body{font:17px Arial,sans-serif}.small{font:15px Arial,sans-serif}.tiny{font:14px Arial,sans-serif}.flow{stroke:#243247;stroke-width:4;fill:none;marker-end:url(#flowArrow)}.bus{stroke:#243247;stroke-width:4;fill:none}.observe{stroke:#b51f5d;stroke-width:3;stroke-dasharray:10 8;fill:none;marker-end:url(#observeArrow)}.recover{stroke:#b51f5d;stroke-width:4;fill:none;marker-end:url(#recoverArrow)}.edge{stroke:#d6dde8;stroke-width:2}.labelbg{fill:#f8fafc}.step{font:700 15px Arial,sans-serif;fill:#fff}
    </style>
    <marker id="flowArrow" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L10 5 L0 10 Z" fill="#243247"/></marker>
    <marker id="observeArrow" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L10 5 L0 10 Z" fill="#b51f5d"/></marker>
    <marker id="recoverArrow" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L10 5 L0 10 Z" fill="#b51f5d"/></marker>
  </defs>

  <rect class="bg" width="1800" height="1800"/>
  <text x="60" y="72" class="title ink">Billo · System Architecture</text>
  <text x="62" y="107" class="sub muted">Make every care dollar count · one case from care search to after-care action</text>

  <!-- Patient journey -->
  <rect x="50" y="135" width="1700" height="205" rx="26" fill="#fffaf0" stroke="#f59e0b" stroke-width="3"/>
  <text x="78" y="174" class="section" fill="#a64b00">PATIENT JOURNEY · SIX EXPLICIT ACTIONS</text>
  <g>
    <rect x="75" y="195" width="240" height="90" rx="17" fill="#fff" stroke="#f59e0b" stroke-width="2"/>
    <text x="195" y="229" text-anchor="middle" class="boxh ink">1 · Describe need</text><text x="195" y="258" text-anchor="middle" class="body muted">plain words</text>
    <rect x="355" y="195" width="240" height="90" rx="17" fill="#fff" stroke="#f59e0b" stroke-width="2"/>
    <text x="475" y="229" text-anchor="middle" class="boxh ink">2 · Compare care</text><text x="475" y="258" text-anchor="middle" class="body muted">place + public price</text>
    <rect x="635" y="195" width="240" height="90" rx="17" fill="#fff" stroke="#f59e0b" stroke-width="2"/>
    <text x="755" y="229" text-anchor="middle" class="boxh ink">3 · Save visit</text><text x="755" y="258" text-anchor="middle" class="body muted">estimate + visit log</text>
    <rect x="915" y="195" width="240" height="90" rx="17" fill="#fff" stroke="#f59e0b" stroke-width="2"/>
    <text x="1035" y="229" text-anchor="middle" class="boxh ink">4 · Send document</text><text x="1035" y="258" text-anchor="middle" class="body muted">bill or paid receipt</text>
    <rect x="1195" y="195" width="240" height="90" rx="17" fill="#fff" stroke="#f59e0b" stroke-width="2"/>
    <text x="1315" y="229" text-anchor="middle" class="boxh ink">5 · Review route</text><text x="1315" y="258" text-anchor="middle" class="body muted">benefit or clinic QR</text>
    <rect x="1475" y="195" width="240" height="90" rx="17" fill="#fff" stroke="#f59e0b" stroke-width="2"/>
    <text x="1595" y="229" text-anchor="middle" class="boxh ink">6 · Approve demo</text><text x="1595" y="258" text-anchor="middle" class="body muted">explicit consent</text>
    <path d="M315 240 H345" class="flow"/><path d="M595 240 H625" class="flow"/><path d="M875 240 H905" class="flow"/><path d="M1155 240 H1185" class="flow"/><path d="M1435 240 H1465" class="flow"/>
    <path d="M75 307 H875" stroke="#a64b00" stroke-width="2"/><text x="475" y="330" text-anchor="middle" class="section" fill="#a64b00">BEFORE CARE</text>
    <path d="M915 307 H1715" stroke="#a64b00" stroke-width="2"/><text x="1315" y="330" text-anchor="middle" class="section" fill="#a64b00">AFTER CARE</text>
  </g>

  <!-- Conversation doors -->
  <text x="60" y="388" class="section" fill="#526075">1 · PATIENT CHOOSES EITHER CONVERSATION DOOR</text>
  <rect x="755" y="405" width="290" height="90" rx="20" fill="#eef2f7" stroke="#526075" stroke-width="3"/>
  <text x="900" y="442" text-anchor="middle" class="h ink">Patient</text><text x="900" y="470" text-anchor="middle" class="small muted">starts one Billo case</text>

  <path d="M900 495 V520 H430" class="bus"/><path d="M430 520 V545" class="flow"/>
  <path d="M900 495 V520 H1370" class="bus"/><path d="M1370 520 V545" class="flow"/>

  <rect x="235" y="550" width="390" height="105" rx="21" fill="#f3f0ff" stroke="#7547f3" stroke-width="3"/>
  <text x="430" y="590" text-anchor="middle" class="h ink">ASI:One · Fetch.ai</text><text x="430" y="620" text-anchor="middle" class="body muted">complete conversational workflow</text>
  <rect x="1175" y="550" width="390" height="105" rx="21" fill="#eafbf8" stroke="#0f9f8e" stroke-width="3"/>
  <text x="1370" y="590" text-anchor="middle" class="h ink">iMessage · Photon</text><text x="1370" y="620" text-anchor="middle" class="body muted">@Billo activates the bridge</text>

  <!-- Routing -->
  <text x="60" y="708" class="section" fill="#5144d9">2 · BOTH DOORS ENTER THE SAME TYPED CASE WORKFLOW</text>
  <path d="M430 655 V685 H760 V725" class="flow"/>
  <path d="M1370 655 V685 H1040 V725" class="flow"/>

  <rect x="650" y="730" width="500" height="115" rx="22" fill="#5747e8"/>
  <text x="900" y="774" text-anchor="middle" class="h" fill="#fff">Billo Coordinator</text>
  <text x="900" y="806" text-anchor="middle" class="body" fill="#ece9ff">case state · intent routing · explicit approvals</text>

  <rect x="1235" y="730" width="300" height="115" rx="20" fill="#fff0f6" stroke="#b51f5d" stroke-width="3"/>
  <text x="1385" y="773" text-anchor="middle" class="h ink">Case Medic</text>
  <text x="1385" y="805" text-anchor="middle" class="body muted">safe recovery actions only</text>

  <!-- Specialist agents -->
  <rect x="50" y="895" width="1500" height="205" rx="24" fill="#f1f2ff" stroke="#6658e8" stroke-width="3" stroke-dasharray="12 8"/>
  <text x="78" y="932" class="section" fill="#5144d9">3 · COORDINATOR DELEGATES TO THE MATCHING SPECIALIST</text>
  <path d="M900 845 V870 H240" class="bus"/>
  <path d="M900 870 H1380" class="bus"/>
  <path d="M240 870 V955" class="flow"/><path d="M620 870 V955" class="flow"/><path d="M1000 870 V955" class="flow"/><path d="M1380 870 V955" class="flow"/>

  <rect x="90" y="960" width="300" height="105" rx="18" fill="#fff" stroke="#ef6a6a" stroke-width="2"/>
  <text x="240" y="1000" text-anchor="middle" class="boxh ink">Red-Flag Screener</text><text x="240" y="1031" text-anchor="middle" class="body muted">fixed emergency rules</text>
  <rect x="470" y="960" width="300" height="105" rx="18" fill="#fff" stroke="#39a9c5" stroke-width="2"/>
  <text x="620" y="1000" text-anchor="middle" class="boxh ink">Care Finder</text><text x="620" y="1031" text-anchor="middle" class="body muted">nearby care + prices</text>
  <rect x="850" y="960" width="300" height="105" rx="18" fill="#fff" stroke="#6658e8" stroke-width="2"/>
  <text x="1000" y="1000" text-anchor="middle" class="boxh ink">After-Care Organizer</text><text x="1000" y="1031" text-anchor="middle" class="body muted">bill and receipt reconciliation</text>
  <rect x="1230" y="960" width="300" height="105" rx="18" fill="#fff" stroke="#29358c" stroke-width="2"/>
  <text x="1380" y="1000" text-anchor="middle" class="boxh ink">Settlement Router</text><text x="1380" y="1031" text-anchor="middle" class="body muted">guards both simulations</text>

  <!-- Core tools -->
  <rect x="50" y="1150" width="1500" height="225" rx="24" fill="#edfbf1" stroke="#16a34a" stroke-width="3" stroke-dasharray="12 8"/>
  <text x="78" y="1188" class="section" fill="#12823d">4 · SPECIALISTS CALL DETERMINISTIC FASTAPI TOOLS ON ORACLE AMPERE A1</text>
  <path d="M240 1065 V1210" class="flow"/><path d="M620 1065 V1210" class="flow"/><path d="M1000 1065 V1210" class="flow"/><path d="M1380 1065 V1210" class="flow"/>

  <rect x="90" y="1215" width="300" height="120" rx="18" fill="#fff" stroke="#16a34a" stroke-width="2"/>
  <text x="240" y="1257" text-anchor="middle" class="boxh ink">Rules engine</text><text x="240" y="1288" text-anchor="middle" class="body muted">safety · consent · routing</text><text x="240" y="1316" text-anchor="middle" class="small muted">AI cannot override decisions</text>
  <rect x="470" y="1215" width="300" height="120" rx="18" fill="#fff" stroke="#16a34a" stroke-width="2"/>
  <text x="620" y="1257" text-anchor="middle" class="boxh ink">Care tools</text><text x="620" y="1288" text-anchor="middle" class="body muted">search · estimate · visit log</text><text x="620" y="1316" text-anchor="middle" class="small muted">NPI and price-source adapters</text>
  <rect x="850" y="1215" width="300" height="120" rx="18" fill="#fff" stroke="#16a34a" stroke-width="2"/>
  <text x="1000" y="1257" text-anchor="middle" class="boxh ink">Document reader</text><text x="1000" y="1288" text-anchor="middle" class="body muted">RapidOCR → vision fallback</text><text x="1000" y="1316" text-anchor="middle" class="small muted">verify fields · delete upload</text>
  <rect x="1230" y="1215" width="300" height="120" rx="18" fill="#fff" stroke="#29358c" stroke-width="2"/>
  <text x="1380" y="1257" text-anchor="middle" class="boxh ink">Settlement guardrails</text><text x="1380" y="1288" text-anchor="middle" class="body muted">provider · amount · consent</text><text x="1380" y="1316" text-anchor="middle" class="small muted">idempotent simulation records</text>

  <!-- Data and integrations -->
  <text x="60" y="1423" class="section" fill="#526075">5 · TOOLS QUERY SOURCES, PERSIST THE CASE, OR ENTER THE SIMULATION BOUNDARY</text>
  <path d="M620 1335 V1400 H285 V1460" class="flow"/>
  <path d="M900 1375 V1460" class="flow"/>
  <path d="M1380 1335 V1460" class="flow"/>

  <rect x="70" y="1465" width="430" height="235" rx="22" fill="#f4f7fb" stroke="#64748b" stroke-width="3"/>
  <text x="98" y="1504" class="section" fill="#526075">EXTERNAL SOURCES · READ</text>
  <text x="100" y="1550" class="body ink">NPI Registry</text><text x="100" y="1583" class="body ink">Care-site and price datasets</text><text x="100" y="1616" class="body ink">Provider hours and addresses</text><text x="100" y="1649" class="body ink">Calendar links</text><text x="100" y="1680" class="small muted">Synthetic data remains the demo fallback.</text>

  <rect x="570" y="1465" width="660" height="235" rx="22" fill="#fff6ee" stroke="#f97316" stroke-width="3"/>
  <text x="598" y="1504" class="section" fill="#c6530c">TIGERDATA · READ / WRITE DURABLE CASE STATE</text>
  <text x="600" y="1550" class="body ink">Price history and percentiles</text><text x="600" y="1583" class="body ink">Saved estimates and live visit events</text><text x="600" y="1616" class="body ink">Document results and after-care records</text><text x="600" y="1649" class="body ink">Benefit checks and settlement audit records</text><text x="600" y="1680" class="small muted">Memory fallback is used only when the database is not configured.</text>

  <rect x="1280" y="1465" width="270" height="235" rx="22" fill="#eef1ff" stroke="#29358c" stroke-width="3"/>
  <text x="1305" y="1504" class="section" fill="#29358c">VISA · SIMULATION</text>
  <text x="1305" y="1550" class="body ink">Unpaid clinic QR</text><text x="1305" y="1580" class="small muted">verify → approve → handoff</text>
  <text x="1305" y="1625" class="body ink">Paid reimbursement</text><text x="1305" y="1655" class="small muted">benefit approval → payout demo</text>
  <text x="1305" y="1683" class="tiny muted">No API · no PAN · no funds moved</text>

  <!-- Sentry sidecar: inbound telemetry and outbound recovery are deliberately separate. -->
  <rect x="1590" y="730" width="160" height="970" rx="24" fill="#fff0f6" stroke="#b51f5d" stroke-width="3"/>
  <text x="1670" y="770" text-anchor="middle" class="section" fill="#b51f5d">SENTRY</text>
  <rect x="1608" y="800" width="124" height="110" rx="16" fill="#b51f5d"/>
  <text x="1670" y="840" text-anchor="middle" class="boxh" fill="#fff">Observe</text><text x="1670" y="870" text-anchor="middle" class="small" fill="#fff">one case</text><text x="1670" y="894" text-anchor="middle" class="small" fill="#fff">one trace</text>
  <text x="1610" y="955" class="boxh ink">Telemetry in</text><text x="1610" y="984" class="small muted">traces · metrics</text><text x="1610" y="1008" class="small muted">latency · releases</text>
  <text x="1610" y="1060" class="boxh ink">Monitoring</text><text x="1610" y="1089" class="small muted">cron follow-ups</text><text x="1610" y="1113" class="small muted">uptime · alerts</text>
  <text x="1610" y="1165" class="boxh ink">Privacy</text><text x="1610" y="1194" class="small muted">no bodies or PHI</text><text x="1610" y="1218" class="small muted">hashed case IDs</text>
  <text x="1610" y="1270" class="boxh ink">Recovery out</text><text x="1610" y="1299" class="small muted">signed webhook</text><text x="1610" y="1323" class="small muted">deduped action</text>
  <text x="1610" y="1375" class="boxh ink">Operations</text><text x="1610" y="1404" class="small muted">dashboards</text><text x="1610" y="1428" class="small muted">deploy gate</text>

  <!-- Telemetry always points into Sentry. Recovery always points out to Case Medic. -->
  <path d="M1550 1008 H1588" class="observe"/>
  <path d="M1550 1275 H1588" class="observe"/>
  <path d="M1590 790 H1540" class="recover"/>
  <rect x="1535" y="748" width="55" height="26" rx="8" class="labelbg"/><text x="1562" y="767" text-anchor="middle" class="tiny" fill="#b51f5d">alert</text>

  <!-- Flow labels -->
  <g>
    <circle cx="920" cy="518" r="17" fill="#f59e0b"/><text x="920" y="524" text-anchor="middle" class="step">1</text>
    <circle cx="900" cy="683" r="17" fill="#f59e0b"/><text x="900" y="689" text-anchor="middle" class="step">2</text>
    <circle cx="920" cy="870" r="17" fill="#f59e0b"/><text x="920" y="876" text-anchor="middle" class="step">3</text>
    <circle cx="820" cy="1125" r="17" fill="#f59e0b"/><text x="820" y="1131" text-anchor="middle" class="step">4</text>
    <circle cx="900" cy="1410" r="17" fill="#f59e0b"/><text x="900" y="1416" text-anchor="middle" class="step">5</text>
  </g>

  <!-- Legend -->
  <rect x="50" y="1730" width="1700" height="48" rx="14" fill="#eef2f7"/>
  <line x1="85" y1="1754" x2="125" y2="1754" class="flow"/><text x="145" y="1761" class="small ink">request / data flow</text>
  <line x1="350" y1="1754" x2="405" y2="1754" class="observe"/><text x="425" y="1761" class="small ink">telemetry into Sentry</text>
  <line x1="670" y1="1754" x2="725" y2="1754" class="recover"/><text x="745" y="1761" class="small ink">signed recovery alert</text>
  <circle cx="1020" cy="1754" r="10" fill="#5747e8"/><text x="1040" y="1761" class="small ink">Fetch.ai</text>
  <circle cx="1160" cy="1754" r="10" fill="#0f9f8e"/><text x="1180" y="1761" class="small ink">Photon</text>
  <circle cx="1295" cy="1754" r="10" fill="#16a34a"/><text x="1315" y="1761" class="small ink">Core</text>
  <circle cx="1390" cy="1754" r="10" fill="#f97316"/><text x="1410" y="1761" class="small ink">TigerData</text>
  <circle cx="1535" cy="1754" r="10" fill="#29358c"/><text x="1555" y="1761" class="small ink">Visa demo</text>
  <circle cx="1670" cy="1754" r="10" fill="#b51f5d"/><text x="1690" y="1761" class="small ink">Sentry</text>
</svg>
