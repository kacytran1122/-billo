name: billo

x-agent: &agent
  build:
    context: ../..
    dockerfile: backend/fetch.ai/Dockerfile
  env_file: ../../.env
  environment:
    CORE_URL: http://core:8000
    BRIDGE_URL: http://photon:3000
  restart: unless-stopped
  depends_on:
    core:
      condition: service_healthy
  networks: [billo]
  security_opt: [no-new-privileges:true]

services:
  core:
    build:
      context: ../..
      dockerfile: Dockerfile
    env_file: ../../.env
    environment:
      CORE_URL: http://core:8000
      CASE_MEDIC_URL: http://case-medic:8007
      BILLO_UPLOADS_DIR: /tmp/billo-uploads
    restart: unless-stopped
    # Core is reachable only on the private Compose network. The Caddy service
    # below is the sole public ingress in the canonical deployment.
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks: [billo]
    security_opt: [no-new-privileges:true]

  coordinator:
    <<: *agent
    command: python coordinator.py
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.create_connection(('127.0.0.1',8001),3); s.close()"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      core: {condition: service_healthy}
      red-flag: {condition: service_healthy}
      care-finder: {condition: service_healthy}
      bill-auditor: {condition: service_healthy}
      settlement-router: {condition: service_healthy}

  red-flag:
    <<: *agent
    command: python red_flag.py
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.create_connection(('127.0.0.1',8002),3); s.close()"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  care-finder:
    <<: *agent
    command: python care_finder.py
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.create_connection(('127.0.0.1',8003),3); s.close()"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  bill-auditor:
    <<: *agent
    command: python bill_auditor.py
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.create_connection(('127.0.0.1',8004),3); s.close()"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  settlement-router:
    <<: *agent
    command: python settlement_router.py
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.create_connection(('127.0.0.1',8005),3); s.close()"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  imessage-gateway:
    <<: *agent
    command: python imessage_gateway.py
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.create_connection(('127.0.0.1',8006),3); s.close()"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      core: {condition: service_healthy}
      coordinator: {condition: service_healthy}

  case-medic:
    <<: *agent
    command: python case_medic.py
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.create_connection(('127.0.0.1',8007),3); s.close()"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  photon:
    build:
      context: ../..
      dockerfile: backend/photon/Dockerfile
    env_file: ../../.env
    environment:
      CORE_URL: http://core:8000
      GATEWAY_URL: http://imessage-gateway:8006
      BRIDGE_PORT: "3000"
      # Keep existing projects on iMessage unless WhatsApp Business has been
      # enabled in Photon and explicitly selected in the host environment.
      PHOTON_CHANNELS: ${PHOTON_CHANNELS:-imessage}
      PHOTON_STATE_FILE: /data/photon-beta.json
    volumes:
      - photon_data:/data
    restart: unless-stopped
    depends_on:
      core:
        condition: service_healthy
      imessage-gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks: [billo]
    security_opt: [no-new-privileges:true]

  caddy:
    image: caddy:2-alpine
    env_file: ../../.env
    restart: unless-stopped
    depends_on:
      core:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [billo]
    security_opt: [no-new-privileges:true]

networks:
  billo:

volumes:
  photon_data:
  caddy_data:
  caddy_config:
