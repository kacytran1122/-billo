name: billo

x-agent: &agent
  build:
    context: ../..
    dockerfile: backend/fetch.ai/Dockerfile
  env_file: ../../.env
  environment:
    CORE_URL: http://core:8000
    BRIDGE_URL: http://photon:3000
  restart: unless-stopped
  depends_on:
    core:
      condition: service_healthy
  networks: [billo]
  security_opt: [no-new-privileges:true]

services:
  core:
    build:
      context: ../..
      dockerfile: Dockerfile
    env_file: ../../.env
    environment:
      CORE_URL: http://core:8000
      CASE_MEDIC_URL: http://case-medic:8007
      BILLO_UPLOADS_DIR: /tmp/billo-uploads
    restart: unless-stopped
    # The Lightsail host runs Caddy as a system service. Keep the upstream
    # reachable only from that host, never from the public network.
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks: [billo]
    security_opt: [no-new-privileges:true]

  coordinator:
    <<: *agent
    command: python coordinator.py

  red-flag:
    <<: *agent
    command: python red_flag.py

  care-finder:
    <<: *agent
    command: python care_finder.py

  bill-auditor:
    <<: *agent
    command: python bill_auditor.py

  settlement-router:
    <<: *agent
    command: python settlement_router.py

  imessage-gateway:
    <<: *agent
    command: python imessage_gateway.py

  case-medic:
    <<: *agent
    command: python case_medic.py

  photon:
    build:
      context: ../..
      dockerfile: backend/photon/Dockerfile
    env_file: ../../.env
    environment:
      CORE_URL: http://core:8000
      GATEWAY_URL: http://imessage-gateway:8006
      BRIDGE_PORT: "3000"
    restart: unless-stopped
    depends_on:
      core:
        condition: service_healthy
      imessage-gateway:
        condition: service_started
    networks: [billo]
    security_opt: [no-new-privileges:true]

  caddy:
    image: caddy:2-alpine
    profiles: ["docker-gateway"]
    env_file: ../../.env
    restart: unless-stopped
    depends_on:
      core:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [billo]
    security_opt: [no-new-privileges:true]

networks:
  billo:

volumes:
  caddy_data:
  caddy_config:
